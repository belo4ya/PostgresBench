---
- name: Prepare benchmark client
  hosts: postgresbench_clients
  gather_facts: true
  become: true
  vars:
    pgdg_keyring: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - jq
          - lsb-release
          - python3
          - python3-apt
          - rsync
        update_cache: true
        state: present

    - name: Create PGDG keyring directory
      ansible.builtin.file:
        path: "{{ pgdg_keyring | dirname }}"
        state: directory
        mode: "0755"

    - name: Install PGDG signing key
      ansible.builtin.get_url:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        dest: "{{ pgdg_keyring }}"
        mode: "0644"

    - name: Add PGDG apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by={{ pgdg_keyring }}]
          https://apt.postgresql.org/pub/repos/apt
          {{ ansible_distribution_release }}-pgdg main
        filename: pgdg
        state: present
        update_cache: true

    - name: Install PostgreSQL 18 client tools and pgbench
      ansible.builtin.apt:
        name:
          - postgresql-18
          - postgresql-client-18
        state: present

    - name: Create benchmark directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - "{{ remote.base_dir }}"
        - "{{ remote.bin_dir }}"
        - "{{ remote.log_dir }}"
        - "{{ remote.work_dir }}"

    - name: Clone benchmark repository
      ansible.builtin.git:
        repo: "{{ benchmark_repo.url }}"
        dest: "{{ remote.repo_dir }}"
        version: "{{ benchmark_repo.ref }}"
        force: true
      become_user: "{{ ansible_user }}"

    - name: Install benchmark runner
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/run-benchmark.sh.j2"
        dest: "{{ remote.runner_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Check client tool versions
      ansible.builtin.command: "{{ item }}"
      changed_when: false
      loop:
        - pgbench --version
        - psql --version
        - jq --version
